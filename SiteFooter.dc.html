<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="background:#FFFFFF;border-top:1px solid #E6E6E6;margin-top:auto;font-family:'Inter',sans-serif;color:#1E1E1E">
  <div style="max-width:1232px;margin:0 auto;padding:56px 16px 32px;display:flex;flex-direction:column;gap:48px">
    <div style="display:flex;flex-wrap:wrap;gap:40px 80px;justify-content:space-between;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:16px;flex:1 1 320px;max-width:560px">
        <a href="/" data-gtm="footer-logo" aria-label="Minute Minder home" onClick="{{ logoClick }}" style="display:flex;align-items:center;gap:10px;text-decoration:none;align-self:flex-start;cursor:pointer">
          <img src="assets/icons/CalendarIcon.svg" alt="" aria-hidden="true" style="width:22px;height:22px;display:block">
          <span style="font-size:22px;line-height:1;font-weight:700;color:#05810A;letter-spacing:-0.01em">Minute Minder</span>
        </a>
        <p style="margin:0;font-size:18px;line-height:1.5;color:#555555;text-wrap:pretty">A simple Google Meet timer that starts from your calendar.</p>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:24px 96px">
        <ul style="display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0">
          <li><a href="/features" data-gtm="footer-features" style="font-size:16px;line-height:24px;color:#1E1E1E;text-decoration:none;transition:color .15s" style-hover="color:#05810A">Features</a></li>
          <li><a href="/how-to-use" data-gtm="footer-how-to-use" style="font-size:16px;line-height:24px;color:#1E1E1E;text-decoration:none;transition:color .15s" style-hover="color:#05810A">How to use</a></li>
          <li><a href="/pricing" data-gtm="footer-pricing" style="font-size:16px;line-height:24px;color:#1E1E1E;text-decoration:none;transition:color .15s" style-hover="color:#05810A">Pricing</a></li>
          <li><a href="/security" data-gtm="footer-privacy" style="font-size:16px;line-height:24px;color:#1E1E1E;text-decoration:none;transition:color .15s" style-hover="color:#05810A">Privacy</a></li>
          <li><a href="/#faq" data-gtm="footer-faq" style="font-size:16px;line-height:24px;color:#1E1E1E;text-decoration:none;transition:color .15s" style-hover="color:#05810A">FAQ</a></li>
        </ul>
        <ul style="display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0">
          <li><a href="/privacy" data-gtm="footer-privacy-policy" style="font-size:16px;line-height:24px;color:#1E1E1E;text-decoration:none;transition:color .15s" style-hover="color:#05810A">Privacy Policy</a></li>
          <li><a href="/terms" data-gtm="footer-terms" style="font-size:16px;line-height:24px;color:#1E1E1E;text-decoration:none;transition:color .15s" style-hover="color:#05810A">Terms</a></li>
          <li><a href="https://forms.gle/B84XkLwbhBqoNJez7" target="_blank" rel="noopener" data-gtm="footer-support" style="font-size:16px;line-height:24px;color:#1E1E1E;text-decoration:none;transition:color .15s" style-hover="color:#05810A">Support</a></li>
        </ul>
      </div>
    </div>
    <p style="margin:0;font-size:14px;line-height:20px;color:#555555">© 2026 Minute Minder</p>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;260px&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      logoClick: e => {
        const p = window.location.pathname;
        if (!/(^|\/)(Home\.dc\.html)?$/.test(p)) return;
        e.preventDefault();
        const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      },
    };
  }
}
</script>
</body>
</html>
